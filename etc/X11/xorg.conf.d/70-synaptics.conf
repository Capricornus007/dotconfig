Section "InputClass"
	Identifier "Touchpad"
	Driver "synaptics"
	MatchIsTouchpad "on"
		Option "TapButton1" "1"
		Option "TapButton2" "3"
		Option "TapButton3" "2"
		Option "VertTwoFingerScroll" "on"
		Option "HorizTwoFingerScroll" "on"
		Option "VertEdgeScroll" "on"
		Option "HorizEdgeScroll" "on"    
		Option "CornerCoasting" "on"
		Option "VertScrollDelta" "-29"
		Option "HorizScrollDelta" "-29"
EndSection
