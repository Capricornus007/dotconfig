# ----------------------------------------------------------------------------
# /etc/tlp.conf - 針對 Ryzen 5600U + TLP 1.10 優化

TLP_ENABLE=1
TLP_WARN_LEVEL=3

# --- 模式切換邏輯 ---
# 啟用自動切換，配合 tlp-pd 使用
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL

# --- 處理器 (AMD P-State EPP) ---
# 對於 amd-pstate-epp + active 模式，scaling_governor 應保持 powersave
# 真正的效能由 EPP (Energy Performance Preference) 控制
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# EPP 設置：AC 追求響應，BAT 追求平衡（不建議在 BAT 下用 power，會卡頓）
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# 平台配置：XiaoXin 的硬體級電力限制
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# 核心 Boost：電池下關閉以降低瞬時高耗電與發熱
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- 顯示卡與屏幕 (AMD & NVIDIA) ---

# NVIDIA (Nouveau): 你的顯卡目前在 D3hot (休眠)，這很好。
# 保持清單確保 TLP 管理其 Runtime PM。
RUNTIME_PM_DRIVER_DENYLIST="amdgpu mei_me nouveau nvidia xhci_hcd"

# AMD GPU 節能 (ABM)：在電池下啟用（1-4，數字越大越省電但影響顯色）
# 需要 Kernel 6.9+ (你已經是 6.19，完全支持)
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# --- 電池維護 (XiaoXin 系列) ---
# 根據你的 tlp-stat 輸出，你的硬體支持的是模式切換而非百分比
# 0 = Standard (充到 100%), 1 = Long_Life (養生模式，限制在 60% 左右)
STOP_CHARGE_THRESH_BAT0=1

# --- 磁碟與 PCIe ---
DISK_DEVICES="nvme0n1"
# NVMe 固態硬碟不需要調度器
DISK_IOSCHED="keep"

# 啟用 PCIe ASPM 節能
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave
