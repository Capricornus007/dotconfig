# 垂直候選字列表
Vertical Candidate List=True
# 使用滑鼠滾輪到上一頁或下一頁
WheelForPaging=True
# 字型
Font="微信公众号：数码迷（ID：wanshuma） 10"
# 功能表字體
MenuFont="霞鶩文楷 TC 10"
# 托盤字體
TrayFont="霞鶩文楷等寬 TC 10"
# 托盤標簽輪廓顏色
TrayOutlineColor=#1f1e33
# 托盤標簽文字顏色
TrayTextColor=#e0e1cc
# 首選文字圖示
PreferTextIcon=True
# 在圖示顯示佈局名稱
ShowLayoutNameInIcon=True
# 使用輸入法語言來顯示文字
UseInputMethodLanguageToDisplayText=True
# 主題
Theme=OriDark
# 深色模式
DarkTheme=OriDark
# 跟隨系統淺色/深色設定
UseDarkTheme=True
# 在主題與桌面支援時使用系統強調色
UseAccentColor=True
# 在 X11 上對不同螢幕使用單獨的 DPI
PerScreenDPI=False
# 在 Wayland 上強制使用字型 DPI
ForceWaylandDPI=0
# 在 Wayland 下啟用分數縮放
EnableFractionalScale=True

